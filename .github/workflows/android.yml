name: Android agent

# Builds the Android agent APK, with the traffic sender (rtnp-send) compiled for arm64 (the Shield) and x86
# (the Android TV emulator). The APK is kept as a run artifact for 30 days. On main, a build with a higher version
# code than the published one is released, and the app on the TV offers it when it starts (android/README.md).
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust for Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android i686-linux-android
          cargo install cargo-ndk --locked

      - name: Build the traffic sender
        env:
          RTNP_SRC: ${{ runner.temp }}/RTN_PackGen
        # The runner's NDK location is a machine variable, which the env context does not see.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          test -d "$ANDROID_NDK_HOME"
          android/build-sender.sh

      # One signing key for every build, so a new APK installs over the one already on the TV. Without the
      # secret (forks, or before it is set) the runner's own debug key is used and an update may need a reinstall.
      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hnw.keystore"
            echo "HNW_KEYSTORE=$RUNNER_TEMP/hnw.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_SIGNING_KEYSTORE is not set; this APK is signed with the runner's debug key."
          fi

      - name: Test and build
        working-directory: android
        env:
          HNW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          HNW_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          HNW_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Show the signing certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: homenetwatch-agent-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # Only main, and only an APK signed with the shared key: the TV refuses an update signed with any other.
  publish:
    name: Publish update
    needs: apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.apk.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: homenetwatch-agent-apk
          path: ${{ runner.temp }}/apk
      - name: Release it if it is newer
        env:
          GH_TOKEN: ${{ github.token }}
        run: android/publish-update.sh "$RUNNER_TEMP/apk/app-debug.apk"
