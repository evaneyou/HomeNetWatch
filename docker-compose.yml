x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# The API containers run as the image's hns user (uid 10001), not root, with no Linux capabilities, no privilege
# gain, and a read-only filesystem apart from their volumes and /tmp. state-init hands them their state first.
x-api-hardening: &api-hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hns}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hns-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-hns}
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hns} -d ${POSTGRES_DB:-hns}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once before the API containers on every start: gives the state volumes to the hns user (uid 10001).
  # Older installs wrote them as root. WireGuard's private key stays root-only (the API never reads it), and the
  # RTNP receiver (uid 65532) reads its keys through its group.
  state-init:
    build:
      context: ./server
    logging: *default-logging
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - wgstate:/state/wireguard
      - rtnpstate:/state/rtnp
      - servertls:/state/tls
    command:
      - sh
      - -c
      - >-
        set -e;
        chown -R 10001:10001 /state/wireguard /state/tls;
        chmod 700 /state/wireguard;
        for f in wg0.conf server.key; do if [ -e /state/wireguard/$$f ]; then chown 0:0 /state/wireguard/$$f; chmod 600 /state/wireguard/$$f; fi; done;
        for f in server.pub handshakes; do if [ -e /state/wireguard/$$f ]; then chmod 644 /state/wireguard/$$f; fi; done;
        chown -R 10001:65532 /state/rtnp;
        find /state/rtnp -type d -exec chmod 750 {} +;
        find /state/rtnp -type f -exec chmod 440 {} +
    restart: "no"

  server:
    build:
      context: ./server
    logging: *default-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hns}:${POSTGRES_PASSWORD:-hns-dev-password}@db:5432/${POSTGRES_DB:-hns}
      WIREGUARD_ENDPOINT: ${WIREGUARD_ENDPOINT:-192.0.2.10:51820}
      WIREGUARD_STATE_DIR: /var/lib/hns-wireguard
      RTNP_STATE_DIR: /var/lib/hns-rtnp
      TLS_DIR: /var/lib/hns-tls
      RUN_BACKGROUND_TASKS: "1"
      # Server Health reads the host (and the backup list) through hoststat's copies, never the host itself.
      HNS_HOSTINFO_DIR: /var/lib/hns-hostinfo
      HNS_HOST_PROC: /var/lib/hns-hostinfo/proc
      HNS_HOST_ROOT: /var/lib/hns-hostinfo/root
    ports:
      - "8847:8847"
    <<: *api-hardening
    # Member of the RTNP receiver's group, so it can hand the receiver its keys without root.
    group_add:
      - "65532"
    volumes:
      - wgstate:/var/lib/hns-wireguard
      - rtnpstate:/var/lib/hns-rtnp
      # Read-only: registration shows the agent TLS key pins inside the setup key.
      - servertls:/var/lib/hns-tls:ro
      - ./geoip:/geoip:ro
      # No host mounts: hoststat copies the few files Server Health needs into this volume.
      - hostinfo:/var/lib/hns-hostinfo:ro
    depends_on:
      db:
        condition: service_healthy
      state-init:
        condition: service_completed_successfully
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8847"

  # Remote agents check in and poll here. They pin this key, printed by `python -m app.tls pins`.
  agent-api:
    build:
      context: ./server
    logging: *default-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hns}:${POSTGRES_PASSWORD:-hns-dev-password}@db:5432/${POSTGRES_DB:-hns}
      WIREGUARD_ENDPOINT: ${WIREGUARD_ENDPOINT:-192.0.2.10:51820}
      WIREGUARD_STATE_DIR: /var/lib/hns-wireguard
      TLS_DIR: /var/lib/hns-tls
      RUN_BACKGROUND_TASKS: "0"
      # This port is public. It serves only /api/v1/agents/* (enrollment); the dashboard API stays behind Caddy.
      AGENT_API_ONLY: "1"
    ports:
      - "8848:8848"
    <<: *api-hardening
    volumes:
      - wgstate:/var/lib/hns-wireguard
      - servertls:/var/lib/hns-tls
    depends_on:
      server:
        condition: service_started
      state-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # One command on one line. Written as a folded block it split before the --ssl flags, and the port served plain
    # HTTP while the agents expect TLS with a pinned key.
    command:
      - sh
      - -c
      - python -m app.tls ensure && exec uvicorn app.main:app --host 0.0.0.0 --port 8848 --ssl-keyfile /var/lib/hns-tls/key.pem --ssl-certfile /var/lib/hns-tls/cert.pem

  # Reads the host for Server Health (CPU, memory, processes, packages, disk use) and copies only that into the
  # hostinfo volume. No network, read-only, one capability (read any folder, for measuring disk use).
  hoststat:
    build:
      context: ./server
    logging: *default-logging
    command: ["python", "-m", "app.host_snapshot"]
    # Root, with only DAC_READ_SEARCH: it reads host files the hns user can't.
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.25
    tmpfs:
      - /tmp
    environment:
      HNS_HOSTINFO_DIR: /var/lib/hns-hostinfo
      HNS_BACKUP_SOURCE: /var/lib/hns-backups
    volumes:
      - /proc:/host/proc:ro
      - /:/host:ro
      - hostinfo:/var/lib/hns-hostinfo
      # backup.sh writes encrypted copies here; only their names and sizes are copied out.
      - ./backups:/var/lib/hns-backups:ro
    restart: unless-stopped

  librespeed:
    build:
      context: ./librespeed
    logging: *default-logging
    restart: unless-stopped

  wireguard:
    build:
      context: .
      dockerfile: wireguard/Dockerfile
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "51820:51820/udp"
      - "0.0.0.0:8998:8998/udp"
    volumes:
      - wgstate:/etc/wireguard
    environment:
      SERVER_PROXY: server:8847
      LIBRESPEED_PROXY: librespeed:8080
    depends_on:
      - server
      - librespeed
    restart: unless-stopped

  rtnp:
    build:
      context: .
      dockerfile: deploy/rtnp.Dockerfile
    logging: *default-logging
    network_mode: service:wireguard
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    tmpfs:
      - /tmp
    volumes:
      - rtnpstate:/var/lib/hns-rtnp:ro
    depends_on:
      - wireguard
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8847}
    logging: *default-logging
    ports:
      - "3847:3847"
    depends_on:
      - server
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8847}

volumes:
  pgdata:
  hostinfo:
  wgstate:
  servertls:
  rtnpstate:
