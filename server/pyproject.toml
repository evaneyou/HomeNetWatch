[project]
name = "hns-server"
version = "0.6"
description = "HomeNetWatch central server"
readme = "README.md"
license = "MIT"
authors = [{ name = "Evan You" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.1",
  "itsdangerous>=2.2.0",
  "httpx>=0.28.0",
  "cryptography>=44.0.0",
  "maxminddb>=2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/evaneyou/homenetwatch"
Issues = "https://github.com/evaneyou/homenetwatch/issues"
Changelog = "https://github.com/evaneyou/homenetwatch/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "alembic", "alembic.ini", "README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
