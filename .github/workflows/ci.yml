name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hns
          POSTGRES_PASSWORD: hns-dev-password
          POSTGRES_DB: hns
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U hns -d hns"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install dependencies
        run: uv sync --extra dev --locked
      - name: Migrate and seed
        run: |
          uv run alembic upgrade head
          uv run python -m app.seed
      - name: Run tests
        run: uv run pytest -q

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          DOMAIN=ci.example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
