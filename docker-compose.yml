x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hns}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hns-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-hns}
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hns} -d ${POSTGRES_DB:-hns}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    logging: *default-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hns}:${POSTGRES_PASSWORD:-hns-dev-password}@db:5432/${POSTGRES_DB:-hns}
      WIREGUARD_ENDPOINT: ${WIREGUARD_ENDPOINT:-10.0.0.123:51820}
      WIREGUARD_STATE_DIR: /var/lib/hns-wireguard
      RTNP_STATE_DIR: /var/lib/hns-rtnp
      RUN_BACKGROUND_TASKS: "1"
    ports:
      - "8847:8847"
    volumes:
      - wgstate:/var/lib/hns-wireguard
      - rtnpstate:/var/lib/hns-rtnp
      - ./geoip:/geoip:ro
      # The host, read-only, so Server Health can see the machine rather than the container.
      - /proc:/host/proc:ro
      - /:/host:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8847"

  # Remote agents check in and poll here. They pin this key, printed by `python -m app.tls pins`.
  agent-api:
    build:
      context: ./server
    logging: *default-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hns}:${POSTGRES_PASSWORD:-hns-dev-password}@db:5432/${POSTGRES_DB:-hns}
      WIREGUARD_ENDPOINT: ${WIREGUARD_ENDPOINT:-10.0.0.123:51820}
      WIREGUARD_STATE_DIR: /var/lib/hns-wireguard
      TLS_DIR: /var/lib/hns-tls
      RUN_BACKGROUND_TASKS: "0"
    ports:
      - "8848:8848"
    volumes:
      - wgstate:/var/lib/hns-wireguard
      - servertls:/var/lib/hns-tls
    depends_on:
      - server
    restart: unless-stopped
    command: >
      sh -c "python -m app.tls ensure &&
             uvicorn app.main:app --host 0.0.0.0 --port 8848
             --ssl-keyfile /var/lib/hns-tls/key.pem --ssl-certfile /var/lib/hns-tls/cert.pem"

  librespeed:
    build:
      context: ./librespeed
    logging: *default-logging
    restart: unless-stopped

  wireguard:
    build:
      context: .
      dockerfile: wireguard/Dockerfile
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "51820:51820/udp"
      - "0.0.0.0:8998:8998/udp"
    volumes:
      - wgstate:/etc/wireguard
    environment:
      SERVER_PROXY: server:8847
      LIBRESPEED_PROXY: librespeed:8080
    depends_on:
      - server
      - librespeed
    restart: unless-stopped

  rtnp:
    build:
      context: .
      dockerfile: deploy/rtnp.Dockerfile
    logging: *default-logging
    network_mode: service:wireguard
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    tmpfs:
      - /tmp
    volumes:
      - rtnpstate:/var/lib/hns-rtnp:ro
    depends_on:
      - wireguard
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8847}
    logging: *default-logging
    ports:
      - "3847:3847"
    depends_on:
      - server
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8847}

volumes:
  pgdata:
  wgstate:
  servertls:
  rtnpstate:
